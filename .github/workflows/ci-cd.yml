
name: FinTrackBuddy CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fintrackbuddy-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: fintrackbuddy-frontend
        run: npm ci

      - name: Build frontend
        working-directory: fintrackbuddy-frontend
        run: npm run build


  # ==========================================
  # BACKEND CI
  # ==========================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fintrackbuddy-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: fintrackbuddy-backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: fintrackbuddy-backend
        run: npx prisma generate


  # ==========================================
  # DOCKER BUILD & PUSH
  # ==========================================
  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - frontend-ci
      - backend-ci

    # Docker images will be pushed ONLY
    # when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # ------------------------------------------
      # Login to Docker Hub
      # ------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------
      # Build & Push Backend Image
      # ------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./fintrackbuddy-backend
          push: true
          tags: yashdev04/fintrackbuddy-backend:latest


      # ------------------------------------------
      # Build & Push Frontend Image
      # ------------------------------------------
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./fintrackbuddy-frontend
          push: true
          tags: yashdev04/fintrackbuddy-frontend:latest

